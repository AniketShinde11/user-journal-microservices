server.port=8081

spring.application.name=user-service

spring.datasource.url=jdbc:sqlserver://localhost:1433;;databaseName=user_journal;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Aniket
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#journal.service.url=${JOURNAL_SERVICE}
journal.service.url=http://journal-service:8082

#jwt.key=${JWT_KEY}
jwt.key=mysecretkeymysecretkeymysecretkey123456

#email.service.url=${EMAIL_SERVICE}
email.service.url=http://localhost:8083

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true



resilience4j.circuitbreaker.instances.journalService.register-health-indicator=true

resilience4j.circuitbreaker.instances.journalService.sliding-window-size=5

resilience4j.circuitbreaker.instances.journalService.failure-rate-threshold=50

resilience4j.circuitbreaker.instances.journalService.wait-duration-in-open-state=30s

resilience4j.circuitbreaker.instances.journalService.permitted-number-of-calls-in-half-open-state=2

resilience4j.circuitbreaker.instances.journalService.automatic-transition-from-open-to-half-open-enabled=true

