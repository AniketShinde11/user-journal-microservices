server.port=9090

spring.application.name=API-GATEWAY

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/user/**,/auth/**


spring.cloud.gateway.routes[1].id=journal-service
spring.cloud.gateway.routes[1].uri=lb://JOURNAL-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/journal/**

spring.cloud.gateway.routes[2].id=email-service
spring.cloud.gateway.routes[2].uri=lb://EMAIL-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/mail/**

JWT_KEY=mysecretkeymysecretkeymysecretkey123456